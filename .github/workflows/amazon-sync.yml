name: Amazon Price Sync (manual — waiting for Creators API access)

# Disabled on a schedule on purpose: the Creators API needs qualifying sales
# before Amazon grants credentials. Run manually once CREATORS_* secrets work.
on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug output'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci || npm install
      - name: Run Creators API sync
        env:
          AMAZON_CREATORS_ID: ${{ secrets.CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_SECRET: ${{ secrets.CREATORS_CREDENTIAL_SECRET }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
        run: npm run sync-creators
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "sync: update prices from Amazon.ae (Creators API)"
          file_pattern: "assets/data/prices.json assets/js/products.js"
